version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: enterprisedb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: enterprise_redis
    restart: always
    ports:
      - '6379:6379'

  # Local email visual testing (Mailpit)
  mailpit:
    image: axllent/mailpit:latest
    container_name: enterprise_mailpit
    restart: always
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI for viewing sent emails!

volumes:
  pgdata:
